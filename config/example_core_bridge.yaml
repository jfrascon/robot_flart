# Each entry in this file represents a rosgz bridge channel, i.e.; a topic that is transfered by the
# rosgz bridge between ROS and Gazebo, with the specified direction and QoS profile.

# The rosgz bridge channel's name is related to the gz plugin that pusblishes or subscribes to the topic.
# If you go to the file example_core_simulation.yaml you can see similar names for the plugins.
# The association between a gz plugin and a rosgz bridge channel is 1:N, meaning that a gz plugin can be associated to
# multiple rosgz bridge channels.
# For example, the gz plugin 'base_pose_ground_truth_publisher' is associated to two channels:
# 'base_pose_ground_truth_publisher' and 'base_pose_ground_truth_publisher_tf'.
# This is because the plugin publishes two topics, one with the odometry message and another with the tf message, and
# we want to transfer both topics to ROS.

base_velocity_controller:
  ros_topic_name: cmd_vel
  gz_topic_name: cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
  qos_profile: SENSOR_DATA
  lazy: True

base_pose_ground_truth_publisher:
  ros_topic_name: base_pose_ground_truth
  gz_topic_name: base_pose_ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.OdometryWithCovariance
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: True

base_pose_ground_truth_publisher_tf:
  ros_topic_name: tf_sim_world_fr_robot_root_fr
  gz_topic_name: tf_sim_world_fr_robot_root_fr
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: False

base_steerable_wheel_command:
  ros_topic_name: joint_commands/base
  gz_topic_name: joint_commands/base
  ros_type_name: actuator_msgs/msg/Actuators
  gz_type_name: gz.msgs.Actuators
  direction: ROS_TO_GZ
  qos_profile: SENSOR_DATA
  lazy: True

fork_position_controller:
  ros_topic_name: joint_commands/fork
  gz_topic_name: joint_commands/fork
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  qos_profile: SENSOR_DATA
  lazy: True

joint_state_publisher:
  ros_topic_name: joint_states
  gz_topic_name: joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: True
