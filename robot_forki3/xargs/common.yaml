# All xarg values in this file are stored as strings.
# This includes numbers, booleans and any other scalar values.
sim_file:
  default_value: ""
  description: "Path to simulation configuration. If empty, the default for the selected robot model is used."

body_use_inertial:
  default_value: "True"
  description: "Use inertial element for the robot body. If False, a null inertia will be used"
  choices: ["True", "true", "False", "false"]
mass:
  default_value: "500"
  description: "Total mass represented by the internal ballast model (kg)."
body_size:
  default_value: "1.531 0.774 1.64"
  description: "Chassis size as 'x y z' in meters. If `body_scale` is applied to `body_mesh`, `body_size` must be the scaled final size."
ballast_size_z:
  default_value: "0.1"
  description: "Ballast height along Z (m)."
body_ground_clearance:
  default_value: "0.06"
  description: "Base-to-ground clearance (m)."
dist_to_wheels:
  default_value: "0.50"
  description: "Distance from base origin to each wheel center in the XY plane (m)."
alpha_deg:
  default_value: "154"
  description: "Wheel layout angle in degrees, used in xacro as radians(alpha_deg)."
body_mesh:
  default_value: "robot_forki3/meshes/forklift_chassis.stl"
  description: "Body mesh path within package format <pkg>/<path>."
body_scale:
  default_value: "1.0 1.0 1.0"
  description: "Body mesh scale as 'sx sy sz'."
body_color:
  default_value: "0.0 0.0 1.0 1.0"
  description: "Body color as 'r g b a'."

s_wheel_use_inertial:
  default_value: "True"
  description: "Use inertial element for wheels. If False, a null inertia will be used"
  choices: ["True", "true", "False", "false"]
s_wheel_mass:
  default_value: "10.0"
  description: "Steerable wheel mass (kg)."
s_wheel_radius:
  default_value: "0.127"
  description: "Steerable wheel radius (m)."
s_wheel_thickness:
  default_value: "0.082"
  description: "Steerable wheel thickness (m)."
s_wheel_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Steerable wheel color as 'r g b a'."
s_wheel_steering_joint_limits:
  default_value: "-3.1416 3.1416 100.0 100000.0"
  description: "Steering joint limits as 'lower upper velocity effort'."
s_wheel_rotation_joint_limits:
  default_value: "100.0 100000.0"
  description: "Wheel rotation joint limits as 'velocity effort'."
s_wheel_max_contacts:
  default_value: "1"
  description: "Maximum contact points for wheel collision."
s_wheel_mu:
  default_value: "0.05"
  description: "Primary friction coefficient for wheel-ground contact."
s_wheel_mu2:
  default_value: "0.5"
  description: "Secondary friction coefficient for wheel-ground contact."
s_wheel_slip1:
  default_value: "0.005"
  description: "Primary slip compliance for wheel-ground contact."
s_wheel_slip2:
  default_value: "0.0005"
  description: "Secondary slip compliance for wheel-ground contact."

fork_use_visual:
  default_value: "True"
  description: "Include visual element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_collision:
  default_value: "True"
  description: "Include collision element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_inertial:
  default_value: "False"
  description: "Use inertial element for the fork."
  choices: ["True", "true", "False", "false"]
fork_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for the fork visual. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Fork color as 'r g b a'."
fork_use_c_mesh:
  default_value: "True"
  description: "Use a mesh for the fork collision. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_limits:
  default_value: "-0.005 0.8 0.2 20000.0"
  description: "Fork prismatic joint limits as 'lower upper velocity effort'."
fork_rest_clearance:
  default_value: "0.03"
  description: "Rest clearance between the fork and the ground."
fork_tine_open:
  default_value: "False"
  description: "If True, tines are left open (no front closing plates). If False, front plates close the tine openings."
  choices: ["True", "true", "False", "false"]
