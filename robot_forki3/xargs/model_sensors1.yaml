# All xacro argument values in this file are stored as strings.
# This includes numbers, booleans and any other scalar values.

# Xacro arguments defined by urdf/includes/common.xacro.
# These fields configure the common Forki3 platform shared by every public model.
sim_file:
  default_value: ""
  description: "Path to simulation configuration. If empty, the default for the selected robot model is used."

body_use_inertial:
  default_value: "True"
  description: "Use inertial element for the robot body. If False, a null inertia will be used"
  choices: ["True", "true", "False", "false"]
mass:
  default_value: "500"
  description: "Total mass represented by the internal ballast model (kg)."
body_size:
  default_value: "1.531 0.774 1.64"
  description: "Chassis size as 'x y z' in meters. If `body_scale` is applied to `body_mesh`, `body_size` must be the scaled final size."
ballast_size_z:
  default_value: "0.1"
  description: "Ballast height along Z (m)."
body_ground_clearance:
  default_value: "0.06"
  description: "Base-to-ground clearance (m)."
dist_to_wheels:
  default_value: "0.50"
  description: "Distance from base origin to each wheel center in the XY plane (m)."
alpha_deg:
  default_value: "154"
  description: "Wheel layout angle in degrees, used in xacro as radians(alpha_deg)."
body_mesh:
  default_value: "robot_forki3/meshes/forklift_chassis.stl"
  description: "Body mesh path within package format <pkg>/<path>."
body_scale:
  default_value: "1.0 1.0 1.0"
  description: "Body mesh scale as 'sx sy sz'."
body_color:
  default_value: "0.0 0.0 1.0 1.0"
  description: "Body color as 'r g b a'."

s_wheel_use_inertial:
  default_value: "True"
  description: "Use inertial element for wheels. If False, a null inertia will be used"
  choices: ["True", "true", "False", "false"]
s_wheel_mass:
  default_value: "10.0"
  description: "Steerable wheel mass (kg)."
s_wheel_radius:
  default_value: "0.127"
  description: "Steerable wheel radius (m)."
s_wheel_thickness:
  default_value: "0.082"
  description: "Steerable wheel thickness (m)."
s_wheel_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Steerable wheel color as 'r g b a'."
s_wheel_steering_joint_limits:
  default_value: "-3.1416 3.1416 100.0 100000.0"
  description: "Steering joint limits as 'lower upper velocity effort'."
s_wheel_rotation_joint_limits:
  default_value: "100.0 100000.0"
  description: "Wheel rotation joint limits as 'velocity effort'."
s_wheel_max_contacts:
  default_value: "1"
  description: "Maximum contact points for wheel collision."
s_wheel_mu:
  default_value: "0.05"
  description: "Primary friction coefficient for wheel-ground contact."
s_wheel_mu2:
  default_value: "0.5"
  description: "Secondary friction coefficient for wheel-ground contact."
s_wheel_slip1:
  default_value: "0.005"
  description: "Primary slip compliance for wheel-ground contact."
s_wheel_slip2:
  default_value: "0.0005"
  description: "Secondary slip compliance for wheel-ground contact."

fork_use_visual:
  default_value: "True"
  description: "Include visual element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_collision:
  default_value: "True"
  description: "Include collision element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_inertial:
  default_value: "False"
  description: "Use inertial element for the fork."
  choices: ["True", "true", "False", "false"]
fork_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for the fork visual. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Fork color as 'r g b a'."
fork_use_c_mesh:
  default_value: "True"
  description: "Use a mesh for the fork collision. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_limits:
  default_value: "-0.005 0.8 0.2 20000.0"
  description: "Fork prismatic joint limits as 'lower upper velocity effort'."
fork_rest_clearance:
  default_value: "0.03"
  description: "Rest clearance between the fork and the ground."
fork_tine_open:
  default_value: "False"
  description: "If True, tines are left open (no front closing plates). If False, front plates close the tine openings."
  choices: ["True", "true", "False", "false"]

# Xacro arguments defined by urdf/models/model_sensors1.xacro.
# These fields configure the sensor module added by model_sensors1.xacro.
top_platform_use_visual:
  default_value: "True"
  description: "Include visual element for the top platform sensor body."
  choices: ["True", "true", "False", "false"]
top_platform_use_collision:
  default_value: "True"
  description: "Include collision element for the top platform sensor body."
  choices: ["True", "true", "False", "false"]
top_platform_use_inertial:
  default_value: "True"
  description: "Include inertial element for the top platform sensor body."
  choices: ["True", "true", "False", "false"]
top_platform_color:
  default_value: "0.0 0.0 1.0 1.0"
  description: "Optional color override 'r g b a'; default matches the base color."

front_top_lidar_use_visual:
  default_value: "True"
  description: "Include visual element for the sensor body."
  choices: ["True", "true", "False", "false"]
front_top_lidar_use_collision:
  default_value: "True"
  description: "Include collision element for the sensor body."
  choices: ["True", "true", "False", "false"]
front_top_lidar_use_inertial:
  default_value: "True"
  description: "Include inertial element for the sensor body."
  choices: ["True", "true", "False", "false"]
front_top_lidar_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for visual; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
front_top_lidar_v_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for visual when using mesh."
  choices: ["True", "true", "False", "false"]
front_top_lidar_color:
  default_value: ""
  description: "Optional color override 'r g b a'; empty keeps mesh color."
front_top_lidar_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for collision; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
front_top_lidar_c_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for collision when using mesh."
  choices: ["True", "true", "False", "false"]
front_top_lidar_mount:
  # tilt_angle = pitch = 20 deg = 0.34906585 rad
  # base_frame is at the center of the bottom face of the chassis.
  # x = x_front_top_corner_chassis + lidar_rad*cos(180 - tilt_angle) + offset_x =
  #   = 0.11 + 0.03*cos(160) + 0 = 0.081809221
  # z = body_size_z + lidar_rad*sin(180 - tilt_angle) + offset_z =
  #   = body_size_z + 0.03*sin(160) + 0 = 1.650260604
  default_value: "0.081809221 0 1.650260604 0 0.34906585 0"
  description: "Optional pose override 'x y z roll pitch yaw' for the front top lidar mount."

back_top_lidar_use_visual:
  default_value: "True"
  description: "Include visual element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_top_lidar_use_collision:
  default_value: "True"
  description: "Include collision element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_top_lidar_use_inertial:
  default_value: "True"
  description: "Include inertial element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_top_lidar_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for visual; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
back_top_lidar_v_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for visual when using mesh."
  choices: ["True", "true", "False", "false"]
back_top_lidar_color:
  default_value: "0 0 0 1"
  description: "Optional color override 'r g b a'; empty keeps mesh color."
back_top_lidar_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for collision; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
back_top_lidar_c_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for collision when using mesh."
  choices: ["True", "true", "False", "false"]
back_top_lidar_mount:
  # tilt_angle = pitch = 20 deg = 0.34906585 rad
  # base_frame is at the center of the bottom face of the chassis.
  # x = x_back_top_corner_chassis + lidar_rad*cos(tilt_angle) + offset_x =
  #   = -0.7655 + 0.03*cos(20) + 0 = −0.737309221
  # z = body_size_z + lidar_rad*sin(180 - tilt_angle) + offset_z =
  #   = body_size_z + 0.03*sin(20) + 0 = 1.650260604
  default_value: "-0.737309221 0 1.650260604 0 0.34906585 3.141592654"
  description: "Optional pose override 'x y z roll pitch yaw' for the back top lidar mount."

back_bottom_lidar_use_visual:
  default_value: "True"
  description: "Include visual element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_use_collision:
  default_value: "True"
  description: "Include collision element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_use_inertial:
  default_value: "True"
  description: "Include inertial element for the sensor body."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for visual; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_v_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for visual when using mesh."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_color:
  default_value: "0 0 0 1"
  description: "Optional color override 'r g b a'; empty keeps mesh color."
back_bottom_lidar_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for collision; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_c_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for collision when using mesh."
  choices: ["True", "true", "False", "false"]
# roll = 180 deg (3.141592654 rad), therefore lidar is upside down.
# x = 0.5 * (body_size_x - sick_s300_size_x) - 0.01 = 0.7025
# z = -body_ground_clearance + sick_s300_size_z + 0.20
#   = -0.06 + 0.152 + 0.20 = 0.292
back_bottom_lidar_mount:
  default_value: "-0.7025 0 0.292 3.141592654 0 3.141592654"
  description: "Optional pose override 'x y z roll pitch yaw' for the back bottom lidar mount."

fork_rgbd_use_visual:
  default_value: "True"
  description: "Include visual element for the sensor."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_collision:
  default_value: "True"
  description: "Include collision element for the sensor."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_inertial:
  default_value: "True"
  description: "Include inertial element for the sensor."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for visual; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_rgbd_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Optional color override 'r g b a'; empty keeps mesh color."
fork_rgbd_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for collision; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
