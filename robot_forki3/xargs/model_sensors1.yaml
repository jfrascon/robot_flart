  description: "Optional color override 'r g b a'; empty keeps mesh color."
back_bottom_lidar_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for collision; if False, use a primitive."
  choices: ["True", "true", "False", "false"]
back_bottom_lidar_c_mesh_use_low_res:
  default_value: "True"
  description: "Prefer low-resolution mesh for collision when using mesh."
  choices: ["True", "true", "False", "false"]
# roll = 180 deg (3.141592654 rad), therefore lidar is upside down.
# x = 0.5 * (body_size_x - sick_s300_size_x) - 0.01 = 0.7025
# z = -body_ground_clearance + sick_s300_size_z + 0.20
#   = -0.06 + 0.152 + 0.20 = 0.292
back_bottom_lidar_mount:
  default_value: "-0.7025 0 0.292 3.141592654 0 3.141592654"
  description: "Optional pose override 'x y z roll pitch yaw' for the back bottom lidar mount."

